      <style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .root {
    width: 100%;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    color: #c8ffdf;
    background: transparent;
    padding: 6px 4px 16px;
  }
  .topbar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  .badge {
    display: inline-block; font-size: 11px; letter-spacing: 0.6px;
    color: #00ff9c; border: 1px solid #00ff9c55; background: #0a0f0a;
    padding: 4px 10px; border-radius: 4px;
  }
  .wrap { display: flex; width: 100%; gap: 20px; }
  .cam { flex: 0 0 auto; text-align: center; max-width: 100%; }
  .cam-label { margin-top: 8px; font-size: 12px; color: #7dffc3; }
  .desc { flex: 1 1 auto; min-width: 0; width: 100%; }
  .panel, .skills {
    background: #0a0f0a; border: 1px solid #1a3d2a; border-radius: 6px;
    padding: 12px 14px; overflow-x: auto; max-width: 100%;
  }
  .panel pre, .skills pre {
    margin: 0; font-size: 11.5px; line-height: 1.45; color: #33ff99;
    white-space: pre; font-family: inherit;
  }
  .skills pre { color: #7dffc3; font-size: 11px; }
  .bio {
    margin: 12px 0; font-size: 12.5px; line-height: 1.55; color: #b7f5d4;
    white-space: normal; overflow-wrap: anywhere; word-break: break-word;
  }
  .skill-flex { text-align: left; }
  .skill-title { color: #00ff9c; font-size: 12px; margin-bottom: 10px; letter-spacing: 0.5px; }
  .skill-row {
    display: flex; flex-wrap: wrap; gap: 6px 10px; padding: 6px 0;
    border-bottom: 1px solid #1a3d2a66; font-size: 11.5px;
  }
  .skill-row .k { flex: 0 0 auto; color: #00ff9c; min-width: 5.5rem; }
  .skill-row .k::before { content: "▸ "; opacity: 0.7; }
  .skill-row .v { flex: 1 1 10rem; color: #7dffc3; overflow-wrap: anywhere; }
  .skill-ok { margin-top: 10px; font-size: 11px; color: #33ff99; text-align: right; }

  .wrap { flex-direction: column; align-items: center; }
  .cam { width: min(200px, 100%); }
  .desc { text-align: left; }
  .badge { font-size: 12px; }
</style>
